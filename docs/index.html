<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Podcast Clipper — schéma du process</title>
<!-- Page publiée par GitHub Pages (dossier docs/). Elle affiche docs/schema.svg et docs/schema_legende.svg, générés par
     scripts/render_schema.py : rien à mettre à jour ici quand le process change (Arthur, 12/10/2026 : « fais la page
     interactive » pour zoomer sans déformer la page). -->
<style>
  :root { --navy: #151D53; --blue: #258AF3; --bg: #F4F6FB; --line: #E1E6F0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); font-family: "Segoe UI", Helvetica, Arial, sans-serif; color: var(--navy); }
  header { height: 64px; display: flex; align-items: center; gap: 18px; padding: 0 20px; background: var(--navy); color: #fff; }
  header h1 { font-size: 18px; margin: 0; font-weight: 700; white-space: nowrap; }
  header h1 b { color: var(--blue); }
  header .hint { font-size: 13px; color: #C9D3F5; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header a { color: #fff; font-size: 13px; white-space: nowrap; }
  .tools { position: fixed; right: 18px; bottom: 18px; display: flex; flex-direction: column; gap: 8px; z-index: 5; }
  .tools button { width: 46px; height: 46px; border-radius: 14px; border: 1px solid var(--line); background: #fff; color: var(--navy);
                  font-size: 22px; font-weight: 700; cursor: pointer; box-shadow: 0 6px 18px rgba(21,29,83,.12); }
  .tools button:hover { border-color: var(--blue); color: var(--blue); }
  .tools .pct { font-size: 12px; text-align: center; color: #5B6680; background: #fff; border-radius: 10px; padding: 4px 0; border: 1px solid var(--line); }
  #legend { position: fixed; left: 18px; bottom: 18px; width: min(560px, calc(100vw - 100px)); z-index: 4;
            border-radius: 16px; box-shadow: 0 6px 18px rgba(21,29,83,.12); background: #fff; }
  #legend img { width: 100%; display: block; border-radius: 16px; }
  #legend button { position: absolute; top: 6px; right: 8px; border: 0; background: none; font-size: 18px; color: #5B6680; cursor: pointer; }
  #view { position: fixed; top: 64px; left: 0; right: 0; bottom: 0; overflow: hidden; cursor: grab; touch-action: none; }
  #view.drag { cursor: grabbing; }
  #stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #stage svg { display: block; border-radius: 18px; box-shadow: 0 8px 30px rgba(21,29,83,.10); }
  #err { padding: 40px; }
</style>
</head>
<body>
<header>
  <h1>Podcast Clipper · <b>schéma du process</b></h1>
  <span class="hint">Molette ou pincement pour zoomer · glisser pour se déplacer · double-clic pour zoomer à cet endroit</span>
  <a href="https://github.com/arthurw31/podcast-clipper#readme">Retour au dépôt</a>
</header>
<div id="view"><div id="stage"></div></div>
<div id="legend"><img src="schema_legende.svg" alt="Légende du schéma"><button title="Masquer la légende" onclick="this.parentNode.remove()">×</button></div>
<div class="tools">
  <button id="zin" title="Zoomer">+</button>
  <div class="pct" id="pct">100 %</div>
  <button id="zout" title="Dézoomer">−</button>
  <button id="fit" title="Tout voir" style="font-size:16px">⤢</button>
</div>
<script>
(async () => {
  const view = document.getElementById("view"), stage = document.getElementById("stage");
  let svgW = 1000, svgH = 1000, s = 1, x = 0, y = 0;
  try {
    const txt = await (await fetch("schema.svg", {cache: "no-cache"})).text();
    stage.innerHTML = txt.replace(/^<!--.*?-->\s*/s, "");
    const svg = stage.querySelector("svg");
    const vb = svg.viewBox.baseVal;
    svgW = vb.width; svgH = vb.height;
    svg.setAttribute("width", svgW); svg.setAttribute("height", svgH);
    svg.style.maxWidth = "none";
  } catch (e) {
    stage.innerHTML = '<p id="err">Schéma introuvable : ' + e + "</p>"; return;
  }
  const apply = () => { stage.style.transform = `translate(${x}px,${y}px) scale(${s})`;
                        document.getElementById("pct").textContent = Math.round(s * 100) + " %"; };
  const fit = () => { const r = view.getBoundingClientRect(), m = 24;
                      s = Math.min((r.width - 2 * m) / svgW, (r.height - 2 * m) / svgH);
                      x = (r.width - svgW * s) / 2; y = m; apply(); };
  const zoomAt = (k, cx, cy) => { const ns = Math.min(4, Math.max(0.1, s * k));
                                  x = cx - (cx - x) * ns / s; y = cy - (cy - y) * ns / s; s = ns; apply(); };
  const center = () => { const r = view.getBoundingClientRect(); return [r.width / 2, r.height / 2]; };
  view.addEventListener("wheel", e => { e.preventDefault(); const r = view.getBoundingClientRect();
    zoomAt(Math.exp(-e.deltaY * 0.0015), e.clientX - r.left, e.clientY - r.top); }, {passive: false});
  view.addEventListener("dblclick", e => { const r = view.getBoundingClientRect(); zoomAt(1.8, e.clientX - r.left, e.clientY - r.top); });
  const pts = new Map(); let last = null, pinch = null;
  view.addEventListener("pointerdown", e => { view.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]);
    view.classList.add("drag"); last = [e.clientX, e.clientY]; });
  view.addEventListener("pointermove", e => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, [e.clientX, e.clientY]);
    if (pts.size === 2) {                                    // pincement à deux doigts
      const [a, b] = [...pts.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]);
      const r = view.getBoundingClientRect(), cx = (a[0] + b[0]) / 2 - r.left, cy = (a[1] + b[1]) / 2 - r.top;
      if (pinch) zoomAt(d / pinch, cx, cy);
      pinch = d; return;
    }
    x += e.clientX - last[0]; y += e.clientY - last[1]; last = [e.clientX, e.clientY]; apply();
  });
  const up = e => { pts.delete(e.pointerId); if (pts.size < 2) pinch = null; if (!pts.size) view.classList.remove("drag");
                    const p = [...pts.values()][0]; if (p) last = p; };
  view.addEventListener("pointerup", up); view.addEventListener("pointercancel", up);
  document.getElementById("zin").onclick = () => zoomAt(1.3, ...center());
  document.getElementById("zout").onclick = () => zoomAt(1 / 1.3, ...center());
  document.getElementById("fit").onclick = fit;
  window.addEventListener("keydown", e => { if (e.key === "+" || e.key === "=") zoomAt(1.3, ...center());
    if (e.key === "-") zoomAt(1 / 1.3, ...center()); if (e.key === "0") fit(); });
  const fitWidth = () => { const r = view.getBoundingClientRect(), m = 24;   // au chargement : toute la largeur, lisible
                           s = Math.min(1, (r.width - 2 * m) / svgW); x = (r.width - svgW * s) / 2; y = m; apply(); };
  window.addEventListener("resize", fitWidth);
  fitWidth();
})();
</script>
</body>
</html>
